name: Scorecard supply-chain analysis
on:
  branch_protection_rule:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard security analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@f49aabe0b5af0936a0968129b410d9e79d1469e3 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: "Upload SARIF results"
        uses: github/codeql-action/upload-sarif@48ab28a6f5dfe220f9c7fe8303573734a34b29f9 # v3.28.0
        with:
          sarif_file: results.sarif
