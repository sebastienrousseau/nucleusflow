[licenses]
# List of allowed licenses for dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-DFS-2016",
    # The ICU4X crates (icu_*, zerovec, yoke, zerofrom, litemap,
    # tinystr, writeable, potential_utf, zerotrie) via textwrap and
    # minify-html's oxc JS minifier; unicode-ident via proc-macro2;
    # unicode-id-start via oxc. All are "(MIT OR Apache-2.0) AND
    # Unicode-3.0" or plain Unicode-3.0.
    "Unicode-3.0",
    # dragonbox_ecma, offered as this OR BSL-1.0.
    "Apache-2.0 WITH LLVM-exception",
    # MPL-2.0 — file-scoped weak copyleft; cssparser, parcel_selectors,
    # and lightningcss via minify-html.
    "MPL-2.0",
    "BSD-2-Clause",
    "ISC",
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# The graph highlighting used when creating dotgraphs for crates with multiple versions
# Options: "lowest-version", "simplest-path", "all"
highlight = "all"

# Certain crates/versions that will be skipped when doing duplicate detection.
skip = []

# Similarly to `skip` allows you to skip certain crates during duplicate detection, unlike skip, it also includes the entire tree of transitive dependencies starting at the specified crate, up to a certain depth, which is by default infinite
skip-tree = []

[advisories]
# List of advisory IDs to ignore (mirrors .cargo/audit.toml)
ignore = [
    "RUSTSEC-2026-0235",
]
